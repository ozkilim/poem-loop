const $ = id => document.getElementById(id);

function spark() {

  const pts = rows.map((r, k) => r.ts == null ? null : [k / n * 1000, 58 - r.ts * 56]).filter(Boolean);

}
function render() {
  const rows = D[chain].rows; i = Math.max(0, Math.min(i, rows.length - 1));
  const r = rows[i];
