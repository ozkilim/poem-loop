- label: end_state
  temperature: 0.8
  seed: 101
  start: '**The Valley’s Jaw**


    Lichen bleaches

    white, gnawing the lip,

    splitting stone

    where the hinge gives way.


    The river dissolves

    the hollow curve,

    polishing edges

    to grit;

    dust settles

    in the teeth.


    Silt fills

    the throat,

    swallowing

    the current.

    Red clay bleeds

    into splits

    where the current gnaws—

    a rust that outlasts the rain.


    Black loam

    holds its breath

    below.


    The ridge tenses.

    Bedrock shifts.

    A crack opens—

    light bleeds in.

    '
